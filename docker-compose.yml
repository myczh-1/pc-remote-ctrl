version: "3.9"

services:
  mqtt:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./backend/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  mqtt-explorer:
    image: smeagolworms4/mqtt-explorer
    profiles: ["debug"]
    restart: unless-stopped
    environment:
      HTTP_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - mqtt

  home-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: pc-remote/home-gateway:local
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      LOCAL_PORT: "7071"
      MQTT_URL: tcp://mqtt:1883
      HOME_DEVICES_DB: /data/home.db
      HOME_DEVICES_FILE: /data/home.db
      HOME_SCENES_FILE: /data/scenes.json
      HOME_AUTOMATIONS_FILE: /data/automations.json
    volumes:
      - ./backend/data:/data
    ports:
      - "7071:7071"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_HOME_GRPCWEB_URL: /api
        VITE_CLOUD_GRPCWEB_URL: /cloud
    image: pc-remote/frontend:local
    restart: unless-stopped
    environment:
      HOME_BACKEND_URL: http://home-gateway:7071/
      CLOUD_GATEWAY_URL: ""
    depends_on:
      - home-gateway
    ports:
      - "8080:80"

volumes:
  mosquitto-data:
  mosquitto-log:
