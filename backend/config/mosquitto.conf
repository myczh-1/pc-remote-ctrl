# Mosquitto 配置 - 用于学习 MQTT 最佳实践

# 基本设置
pid_file /var/run/mosquitto.pid
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# 网络设置
port 1883
# WebSocket 支持（可选）
listener 9001
protocol websockets

# 开发环境设置（生产环境需要修改）
allow_anonymous true

# 日志级别（开发时用 debug，生产用 warning）
log_type error
log_type warning
log_type notice
log_type information
# log_type debug

# 连接设置
max_connections 1000
max_keepalive 65535

# 消息大小限制
message_size_limit 268435456

# QoS 设置
max_inflight_messages 20
max_queued_messages 1000