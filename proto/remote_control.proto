syntax = "proto3";

package remote_control;

option go_package = "pc-remote-ctrl/backend/proto;controllerpb";

// 控制器服务 - 统一基于命令集概念
service ControllerService {
  // 执行命令集
  rpc ExecuteCommandSet(ExecuteCommandSetRequest) returns (ExecuteCommandSetResponse);
  // 存储命令集
  rpc StoreCommandSet(StoreCommandSetRequest) returns (StoreCommandSetResponse);
  // 获取全部命令集
  rpc GetAllCommandSets(GetAllCommandSetsRequest) returns (GetAllCommandSetsResponse);
}

// 执行命令集请求
message ExecuteCommandSetRequest {
  string command_set_id = 1;  // 命令集ID
}

// 步骤执行结果
message StepResult {
  int32 step_index = 1;       // 步骤索引（从0开始）
  string step_script = 2;     // 步骤脚本内容
  string output = 3;          // 输出内容
  string error = 4;           // 错误信息
  int32 exit_code = 5;        // 退出码（0表示成功）
  bool success = 6;           // 是否成功
}

// 执行命令集响应
message ExecuteCommandSetResponse {
  repeated StepResult step_results = 1;  // 每个步骤的执行结果
  bool success = 2;                      // 整体是否成功
  string error = 3;                      // 整体错误信息（如果有）
}

// 存储命令集请求
message StoreCommandSetRequest {
  string command_set_id = 1;           // 命令集ID
  string command_set_name = 2;         // 命令集名称
  repeated string command_scripts = 3; // 命令脚本列表
  string description = 4;              // 描述
}

// 存储命令集响应
message StoreCommandSetResponse {
  bool success = 1;
  string message = 2;
}

// 获取全部命令集请求
message GetAllCommandSetsRequest {
  // 空请求
}

// 命令集信息
message CommandSetInfo {
  string command_set_id = 1;           // 命令集ID
  string command_set_name = 2;         // 命令集名称
  repeated string command_scripts = 3; // 命令脚本列表
  string description = 4;              // 描述
}

// 获取全部命令集响应
message GetAllCommandSetsResponse {
  repeated CommandSetInfo command_sets = 1;
}
