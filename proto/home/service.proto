syntax = "proto3";

package remote_control.home;

option go_package = "pc-remote-ctrl/backend/proto/home;homepb";

import "google/protobuf/struct.proto";

enum AdapterKind {
  ADAPTER_KIND_UNSPECIFIED = 0;
  MQTT = 1;
  SERIAL = 2;
  HTTP = 3;
}

enum TelemetryEventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  STATE = 1;          // device state update
  ONLINE = 2;         // online/offline status
  ACTION_RESULT = 3;  // action execution result
  EVENT = 4;          // custom event
}

message Adapter {
  AdapterKind kind = 1;
  map<string, string> config = 2;
}

message ActionSpec {
  string name = 1;
  map<string, string> args_schema = 2;
  int32 timeout_ms = 3;
}

message Device {
  string id = 1;
  string name = 2;
  string type = 3;
  string room = 4;
  repeated string tags = 5;
  bool online = 6;
  int64 last_seen = 7;
  map<string, string> topics = 8;
  Adapter adapter = 9;
  repeated ActionSpec actions = 10;
  google.protobuf.Struct state = 11;
  string model_id = 12;
  string model_version = 13;
}

message ListDevicesRequest {
  repeated string ids = 1;
  string type = 2;
  string room = 3;
  repeated string tags = 4;
  bool include_state = 5;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message WatchDevicesRequest {
  repeated string ids = 1; // empty for all
}

message DeviceEvent {
  string device_id = 1;
  int64 ts = 2;
  TelemetryEventKind kind = 3;
  google.protobuf.Struct payload = 4;
}

message UpsertDeviceRequest {
  Device device = 1;
}

message UpsertDeviceResponse {
  bool ok = 1;
  string message = 2;
}

message DeleteDeviceRequest {
  string device_id = 1;
}

message DeleteDeviceResponse {
  bool ok = 1;
  string message = 2;
}

message InvokeActionRequest {
  string device_id = 1;
  string action = 2;
  google.protobuf.Struct args = 3;
  int32 timeout_ms = 4;
}

message InvokeActionResponse {
  bool ok = 1;
  string message = 2;
  string corr_id = 3;
  google.protobuf.Struct data = 4;
}

message LogEntry {
  int64 id = 1;
  int64 ts = 2;
  string kind = 3;
  string subject = 4;
  string actor = 5;
  google.protobuf.Struct data = 6;
}

message ListLogsRequest {
  string kind = 1;
  string subject = 2;
  int32 page_size = 3;
  string page_token = 4; // last seen id for keyset pagination
}

message ListLogsResponse {
  repeated LogEntry entries = 1;
  string next_page_token = 2;
}

message CleanupLogsRequest {
  int64 before_ts = 1; // delete logs with ts < before_ts; 0 => all
  int32 limit = 2;     // optional safety cap; 0 => no cap
}

message CleanupLogsResponse {
  int32 deleted = 1;
}

message AutomationAction {
  string device_id = 1;
  string action = 2;
  google.protobuf.Struct args = 3;
}

message Automation {
  string id = 1;
  string name = 2;
  repeated string tags = 3;
  bool enabled = 4;
  google.protobuf.Struct when = 5;
  repeated AutomationAction then = 6;
  int64 updated_at = 7;
}

message ListAutomationsRequest {
  bool include_disabled = 1;
  int32 page_size = 2;
  string page_token = 3;
  string tag = 4;
  string name_contains = 5;
}

message ListAutomationsResponse {
  repeated Automation automations = 1;
  string next_page_token = 2;
}

message UpsertAutomationRequest {
  Automation automation = 1;
}

message UpsertAutomationResponse {
  bool ok = 1;
  string message = 2;
  string automation_id = 3;
}

message DeleteAutomationRequest {
  string automation_id = 1;
}

message DeleteAutomationResponse {
  bool ok = 1;
  string message = 2;
}

message SetAutomationEnabledRequest {
  string automation_id = 1;
  bool enabled = 2;
}

message SetAutomationEnabledResponse {
  bool ok = 1;
  string message = 2;
}

message TriggerAutomationRequest {
  string automation_id = 1;
  google.protobuf.Struct payload = 2; // optional context for audit
}

message TriggerAutomationResponse {
  bool ok = 1;
  string message = 2;
}

message DeviceModel {
  string id = 1;
  string version = 2;
  string name = 3;
  string description = 4;
  repeated string tags = 5;
  repeated ActionSpec actions = 6;
  map<string, string> state_schema = 7;
  int64 updated_at = 8;
}

message DeviceModelSpec {
  string id = 1;
  string version = 2;
  string name = 3;
  string description = 4;
  repeated string tags = 5;
  repeated ActionSpec actions = 6;
  map<string, string> state_schema = 7;
}

message ListDeviceModelsRequest {
  string id = 1;
  string name_contains = 2;
}

message ListDeviceModelsResponse {
  repeated DeviceModel models = 1;
}

message GetDeviceModelRequest {
  string id = 1;
  string version = 2;
}

message GetDeviceModelResponse {
  DeviceModel model = 1;
}

message CreateDeviceModelRequest {
  DeviceModelSpec model = 1;
}

message CreateDeviceModelResponse {
  bool ok = 1;
  string message = 2;
}

message UpdateDeviceModelRequest {
  DeviceModelSpec model = 1;
}

message UpdateDeviceModelResponse {
  bool ok = 1;
  string message = 2;
}

message DeleteDeviceModelRequest {
  string id = 1;
  string version = 2;
}

message DeleteDeviceModelResponse {
  bool ok = 1;
  string message = 2;
}

service HomeService {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc WatchDevices(WatchDevicesRequest) returns (stream DeviceEvent);
  rpc UpsertDevice(UpsertDeviceRequest) returns (UpsertDeviceResponse);
  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse);
  rpc InvokeAction(InvokeActionRequest) returns (InvokeActionResponse);
}

service AuditService {
  rpc ListLogs(ListLogsRequest) returns (ListLogsResponse);
  rpc CleanupLogs(CleanupLogsRequest) returns (CleanupLogsResponse);
}

service AutomationService {
  rpc ListAutomations(ListAutomationsRequest) returns (ListAutomationsResponse);
  rpc UpsertAutomation(UpsertAutomationRequest) returns (UpsertAutomationResponse);
  rpc DeleteAutomation(DeleteAutomationRequest) returns (DeleteAutomationResponse);
  rpc SetAutomationEnabled(SetAutomationEnabledRequest) returns (SetAutomationEnabledResponse);
  rpc TriggerAutomation(TriggerAutomationRequest) returns (TriggerAutomationResponse);
}

service DeviceModelService {
  rpc ListDeviceModels(ListDeviceModelsRequest) returns (ListDeviceModelsResponse);
  rpc GetDeviceModel(GetDeviceModelRequest) returns (GetDeviceModelResponse);
  rpc CreateDeviceModel(CreateDeviceModelRequest) returns (CreateDeviceModelResponse);
  rpc UpdateDeviceModel(UpdateDeviceModelRequest) returns (UpdateDeviceModelResponse);
  rpc DeleteDeviceModel(DeleteDeviceModelRequest) returns (DeleteDeviceModelResponse);
}
