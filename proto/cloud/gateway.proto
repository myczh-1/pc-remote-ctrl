syntax = "proto3";

package remote_control.cloud.v1;

option go_package = "pc-remote-ctrl/cloud-middleware/proto/cloud;cloudpb";

// 云端网关服务：通用透传 RPC 到反向隧道，本身不理解业务 proto
service GatewayService {
  // 一次性请求/响应
  rpc Unary(ProxyUnaryRequest) returns (ProxyUnaryResponse);

  // 服务器流式响应（例如 WatchDevices）
  rpc Stream(ProxyStreamRequest) returns (stream ProxyStreamResponse);
}

message ProxyUnaryRequest {
  string device_id = 1; // 目标设备/网关ID
  string method = 2;    // 目标方法名，例如 "/remote_control.home.HomeService/ListDevices"
  bytes payload = 3;    // 请求 payload（protobuf wire bytes）
}

message ProxyUnaryResponse {
  bytes payload = 1;    // 响应 payload（protobuf wire bytes）
}

message ProxyStreamRequest {
  string device_id = 1; // 目标设备/网关ID
  string method = 2;    // 目标方法名，例如 "/remote_control.home.HomeService/WatchDevices"
  bytes payload = 3;    // 请求 payload（protobuf wire bytes）
}

message ProxyStreamResponse {
  bytes payload = 1;    // 流式响应 payload（protobuf wire bytes）
}
