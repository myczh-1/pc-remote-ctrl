syntax = "proto3";

package remote_control.cloud.v1;

option go_package = "pc-remote-ctrl/cloud-middleware/proto/cloud;cloudpb";

// 导入智能家居服务定义
import "home/service.proto";

// 云端网关服务：前端调用此服务，由云端转发到具体设备上的 HomeService
service GatewayService {
  // 列出设备（转发到 HomeService）
  rpc ListDevices(ListDevicesRequest) returns (remote_control.home.ListDevicesResponse);

  // 监听设备事件（转发到 HomeService）
  rpc WatchDevices(WatchDevicesRequest) returns (stream remote_control.home.DeviceEvent);

  // 注册/更新设备（转发到 HomeService）
  rpc UpsertDevice(UpsertDeviceRequest) returns (remote_control.home.UpsertDeviceResponse);

  // 删除设备（转发到 HomeService）
  rpc DeleteDevice(DeleteDeviceRequest) returns (remote_control.home.DeleteDeviceResponse);

  // 调用设备动作（转发到 HomeService）
  rpc InvokeAction(InvokeActionRequest) returns (remote_control.home.InvokeActionResponse);

  // 自动化：查询/管理/触发（转发到 AutomationService）
  rpc ListAutomations(ListAutomationsRequest) returns (remote_control.home.ListAutomationsResponse);
  rpc UpsertAutomation(UpsertAutomationRequest) returns (remote_control.home.UpsertAutomationResponse);
  rpc DeleteAutomation(DeleteAutomationRequest) returns (remote_control.home.DeleteAutomationResponse);
  rpc SetAutomationEnabled(SetAutomationEnabledRequest) returns (remote_control.home.SetAutomationEnabledResponse);
  rpc TriggerAutomation(TriggerAutomationRequest) returns (remote_control.home.TriggerAutomationResponse);
}

// 审计日志：代理 HomeService.AuditService
service AuditService {
  rpc ListLogs(ListAuditLogsRequest) returns (remote_control.home.ListLogsResponse);
  rpc CleanupLogs(CleanupAuditLogsRequest) returns (remote_control.home.CleanupLogsResponse);
}

message ListDevicesRequest {
  string device_id = 1; // 目标设备/网关ID
  remote_control.home.ListDevicesRequest request = 2;
}

message WatchDevicesRequest {
  string device_id = 1; // 目标设备/网关ID
  remote_control.home.WatchDevicesRequest request = 2;
}

message UpsertDeviceRequest {
  string device_id = 1; // 目标设备/网关ID
  remote_control.home.UpsertDeviceRequest request = 2;
}

message DeleteDeviceRequest {
  string device_id = 1; // 目标设备/网关ID
  remote_control.home.DeleteDeviceRequest request = 2;
}

message InvokeActionRequest {
  string device_id = 1; // 目标设备/网关ID
  remote_control.home.InvokeActionRequest request = 2;
}

message ListAutomationsRequest {
  string device_id = 1; // 目标设备/网关ID
  remote_control.home.ListAutomationsRequest request = 2;
}

message UpsertAutomationRequest {
  string device_id = 1; // 目标设备/网关ID
  remote_control.home.UpsertAutomationRequest request = 2;
}

message DeleteAutomationRequest {
  string device_id = 1; // 目标设备/网关ID
  remote_control.home.DeleteAutomationRequest request = 2;
}

message SetAutomationEnabledRequest {
  string device_id = 1; // 目标设备/网关ID
  remote_control.home.SetAutomationEnabledRequest request = 2;
}

message TriggerAutomationRequest {
  string device_id = 1; // 目标设备/网关ID
  remote_control.home.TriggerAutomationRequest request = 2;
}

message ListAuditLogsRequest {
  string device_id = 1;
  remote_control.home.ListLogsRequest request = 2;
}

message CleanupAuditLogsRequest {
  string device_id = 1;
  remote_control.home.CleanupLogsRequest request = 2;
}
