syntax = "proto3";

package remote_control.cloud.v1;

option go_package = "pc-remote-ctrl/cloud-middleware/proto;cloudpb";

// 复用 Agent 的请求/响应类型
import "remote_control.proto";

// 云端网关服务：前端调用此服务，由云端转发到具体设备上的 Agent
service GatewayService {
  // 执行命令集（转发到 Agent 的 ExecuteCommandSet）
  rpc ExecuteOnDevice(ExecuteOnDeviceRequest) returns (remote_control.ExecuteCommandSetResponse);

  // 列出设备上的命令集（转发到 Agent 的 GetAllCommandSets）
  rpc ListDeviceCommandSets(ListDeviceCommandSetsRequest) returns (remote_control.GetAllCommandSetsResponse);

  // 在设备上存储（创建）命令集（转发到 Agent 的 StoreCommandSet）
  rpc StoreOnDevice(StoreOnDeviceRequest) returns (remote_control.StoreCommandSetResponse);

  // 在设备上更新命令集（转发到 Agent 的 UpdateCommandSet）
  rpc UpdateOnDevice(UpdateOnDeviceRequest) returns (remote_control.UpdateCommandSetResponse);

  // 在设备上删除命令集（转发到 Agent 的 DeleteCommandSet）
  rpc DeleteOnDevice(DeleteOnDeviceRequest) returns (remote_control.DeleteCommandSetResponse);
}

message ExecuteOnDeviceRequest {
  string device_id = 1; // 目标设备ID
  remote_control.ExecuteCommandSetRequest request = 2; // 透传到 Agent 的请求
}

message ListDeviceCommandSetsRequest {
  string device_id = 1;
  remote_control.GetAllCommandSetsRequest request = 2; // 空请求
}

message StoreOnDeviceRequest {
  string device_id = 1;
  remote_control.StoreCommandSetRequest request = 2;
}

message UpdateOnDeviceRequest {
  string device_id = 1;
  remote_control.UpdateCommandSetRequest request = 2;
}

message DeleteOnDeviceRequest {
  string device_id = 1;
  remote_control.DeleteCommandSetRequest request = 2;
}
