wo jsyntax = "proto3";

package remote_control.cloud.v1;

option go_package = "pc-remote-ctrl/cloud-middleware/proto;cloudpb";

// 标识要在 Agent 上调用的控制器方法
enum ControllerMethod {
  CONTROLLER_METHOD_EXECUTE = 0; // 执行命令集
  CONTROLLER_METHOD_STORE   = 1; // 存储命令集
  CONTROLLER_METHOD_UPDATE  = 2; // 更新命令集
  CONTROLLER_METHOD_DELETE  = 3; // 删除命令集
  CONTROLLER_METHOD_LIST    = 4; // 获取全部命令集
}

// 设备注册与状态服务（云端中间件实现）
service DeviceRegistryService {
  // 设备清单查询（返回全部设备）
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);

  // Agent 主动连接 Cloud 的控制面双向流：连接、心跳、命令请求/响应
  rpc ConnectAgent(stream AgentMessage) returns (stream CloudMessage);

  // 日志上报（Agent -> Cloud）。用于大体量/连续日志，避免阻塞控制面流。
  rpc StreamLogs(stream LogLine) returns (stream LogAck);
}

message ListDevicesRequest {
  // 已移除 user_id，保留字段号避免兼容性问题
  reserved 1;
}

message DeviceInfo {
  string device_id = 1;
  string name = 2;
  string address = 3;
  string status = 4; // online/offline
}

message ListDevicesResponse {
  repeated DeviceInfo devices = 1;
}

// Agent到Cloud的消息
message AgentMessage {
  oneof message {
    AgentConnect connect = 1;        // Agent连接注册
    AgentHeartbeat heartbeat = 2;    // Agent心跳
    CommandResponse response = 3;    // 命令执行结果
  }
}

// Cloud到Agent的消息  
message CloudMessage {
  oneof message {
    ConnectAck connect_ack = 1;      // 连接确认
    CommandRequest command = 2;      // 命令执行请求
    Ping ping = 3;                   // 心跳ping
  }
}

// Agent连接注册
message AgentConnect {
  string device_id = 1;
  // 已移除 user_id，保留字段号
  reserved 2;
  string name = 3;
  string version = 4;
}

// 连接确认
message ConnectAck {
  bool success = 1;
  string message = 2;
  string session_id = 3;
}

// Agent心跳
message AgentHeartbeat {
  string device_id = 1;
  int64 timestamp = 2;
}

// 命令执行请求（Cloud->Agent）
message CommandRequest {
  string request_id = 1;           // 请求ID，用于响应匹配
  bytes payload = 2;               // 序列化的请求，类型由 method 指示
  ControllerMethod method = 3;     // 控制器方法类型
}

// 命令执行响应（Agent->Cloud）
message CommandResponse {
  string request_id = 1;           // 对应的请求ID
  bytes payload = 2;               // 序列化的ExecuteCommandSetResponse
}

// Ping消息
message Ping {
  int64 timestamp = 1;
}

// 日志行（分片）
message LogLine {
  string device_id = 1;
  string stream_id = 2;   // 日志流会话ID
  int64 seq = 3;          // 递增序号
  int64 ts = 4;           // 发送时间戳（ns）
  string level = 5;       // INFO/WARN/ERROR
  bytes chunk = 6;        // 按块切分的日志内容（UTF-8或二进制）
  bool end = 7;           // 本流结束
}

// 日志确认
message LogAck {
  string stream_id = 1;
  int64 ack_seq = 2;      // 已确认的最大序号
}
