<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PC Remote Control — Desktop UI Mock</title>
    <!-- TailwindCDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: {
                            DEFAULT: "#0B0F14",
                            soft: "#0F141A",
                            softer: "#0C1117",
                        },
                        card: {
                            DEFAULT: "#0F141A",
                            stroke: "#1E2630"
                        },
                        prime: {
                            50: '#ECFEFF', 100: '#CFFAFE', 200: '#A5F3FC', 300: '#67E8F9',
                            400: '#22D3EE', 500: '#06B6D4', 600: '#0891B2', 700: '#0E7490'
                        },
                    },
                    boxShadow: {
                        soft: '0 8px 30px rgba(0,0,0,0.35)',
                        ring: 'inset 0 1px 0 rgba(255,255,255,0.04), 0 8px 24px rgba(2,8,23,0.6)'
                    },
                    backdropBlur: { xs: '2px' },
                }
            }
        }
    </script>
    <style>
        /* Decorative background glow */
        .bg-glow::before, .bg-glow::after { content: ""; position: absolute; inset: auto; z-index: 0; filter: blur(80px); opacity: .35; }
        .bg-glow::before{ width: 420px; height: 420px; left: -120px; top: -80px; background: radial-gradient( circle at center, #22D3EE 0%, transparent 60% ); }
        .bg-glow::after{ width: 520px; height: 520px; right: -160px; bottom: -120px; background: radial-gradient( circle at center, #A78BFA 0%, transparent 60% ); }
        .status-dot{ width:10px; height:10px; border-radius:9999px; display:inline-block; }
        .status-on{ background: #22C55E; box-shadow:0 0 0 3px rgba(34,197,94,.15); }
        .status-off{ background: #EF4444; box-shadow:0 0 0 3px rgba(239,68,68,.12); }
        .status-idle{ background: #9CA3AF; box-shadow:0 0 0 3px rgba(156,163,175,.12); }
        .glass { background: rgba(13,18,26,.7); backdrop-filter: saturate(140%) blur(8px); border:1px solid rgba(255,255,255,0.06); }
        .card { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.06); }
        .card-hover { transition: all .18s ease; }
        .card-hover:hover { border-color: rgba(34,211,238,.55); box-shadow: 0 0 0 3px rgba(34,211,238,.12), 0 10px 30px rgba(0,0,0,.35); transform: translateY(-1px); }
        .kbd { background:#0B1220; border:1px solid #1f2837; padding:.15rem .38rem; border-radius:.5rem; font: 500 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas; color:#a3e7ff }
        .log-line.err{ color:#FCA5A5 }
        .log-line.ok{ color:#86EFAC }
        .log-line.info{ color:#93C5FD }
    </style>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-bg text-slate-100 relative selection:bg-prime-400/20 selection:text-white">
<div class="absolute inset-0 bg-glow pointer-events-none"></div>

<!-- App Shell -->
<div class="relative z-10 flex h-screen">
    <!-- Sidebar -->
    <aside class="w-[280px] hidden xl:flex flex-col gap-4 p-4 glass shadow-ring">
        <div class="flex items-center gap-2 px-2 pt-1">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-prime-400/70 to-indigo-400/70 grid place-items-center shadow-soft">
                <i data-lucide="cpu" class="w-4 h-4"></i>
            </div>
            <div>
                <div class="text-sm uppercase tracking-widest text-slate-400">Console</div>
                <div class="font-semibold">PC Remote Control</div>
            </div>
        </div>

        <div class="mt-2">
            <div class="text-xs uppercase tracking-wider text-slate-400 px-2 mb-2">Devices</div>
            <div id="device-list" class="flex flex-col gap-2">
                <!-- devices injected by JS -->
            </div>
            <button id="add-device" class="mt-3 w-full inline-flex items-center justify-center gap-2 rounded-xl bg-slate-800/60 hover:bg-slate-700/60 border border-white/5 py-2 text-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> 添加设备
            </button>
        </div>

        <div class="mt-auto grid grid-cols-2 gap-2">
            <div class="card rounded-xl p-3">
                <div class="text-[11px] text-slate-400">Online</div>
                <div id="stat-online" class="text-xl font-semibold">0</div>
            </div>
            <div class="card rounded-xl p-3">
                <div class="text-[11px] text-slate-400">Offline</div>
                <div id="stat-offline" class="text-xl font-semibold">0</div>
            </div>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col">
        <!-- Topbar -->
        <header class="glass border-b border-white/5 px-5 py-3 flex items-center gap-3">
            <div class="xl:hidden flex items-center gap-2 mr-2">
                <button class="rounded-lg p-2 hover:bg-white/5" title="Menu"><i data-lucide="panel-left" class="w-5 h-5"></i></button>
            </div>
            <div class="relative flex-1 max-w-2xl">
                <input id="search" placeholder="搜索命令 / 设备 / 历史…" class="w-full rounded-xl bg-slate-900/60 border border-white/5 pl-10 pr-3 py-2 outline-none focus:ring-2 focus:ring-prime-400/40"/>
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-2.5 text-slate-400"></i>
            </div>
            <div class="flex items-center gap-2 ml-auto">
                <span class="hidden md:inline-flex items-center gap-2 rounded-xl border border-white/5 px-3 py-1.5 bg-slate-900/60"><span class="status-dot status-on"></span><span class="text-sm">在线 <b id="chip-online">0</b></span></span>
                <span class="hidden md:inline-flex items-center gap-2 rounded-xl border border-white/5 px-3 py-1.5 bg-slate-900/60"><span class="status-dot status-idle"></span><span class="text-sm">排队 <b id="chip-queue">0</b></span></span>
                <span class="hidden md:inline-flex items-center gap-2 rounded-xl border border-white/5 px-3 py-1.5 bg-slate-900/60"><span class="status-dot status-off"></span><span class="text-sm">失败 <b id="chip-fail">0</b></span></span>
                <button id="btn-run-all" class="ml-2 inline-flex items-center gap-2 rounded-xl bg-gradient-to-br from-prime-400/80 to-indigo-400/80 hover:from-prime-400 hover:to-indigo-400 text-slate-900 font-semibold px-4 py-2 shadow-soft">
                    <i data-lucide="play" class="w-4 h-4"></i> 一键运行
                </button>
            </div>
        </header>

        <!-- Tabs / Toolbar -->
        <div class="px-5 py-3 flex items-center gap-2 border-b border-white/5 bg-bg/60">
            <nav class="flex gap-2 text-sm">
                <button class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10">命令集</button>
                <button class="px-3 py-1.5 rounded-lg hover:bg-white/5 border border-white/10">Playbooks</button>
                <button class="px-3 py-1.5 rounded-lg hover:bg-white/5 border border-white/10">历史</button>
            </nav>
            <div class="ml-auto flex items-center gap-2">
                <button class="px-3 py-1.5 rounded-lg border border-white/10 hover:bg-white/5 inline-flex items-center gap-2"><i data-lucide="sliders" class="w-4 h-4"></i> 过滤</button>
                <button class="px-3 py-1.5 rounded-lg border border-white/10 hover:bg-white/5 inline-flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> 新建命令</button>
            </div>
        </div>

        <!-- Content: Command Grid -->
        <section class="relative flex-1 overflow-auto px-5 py-6">
            <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4">
                <!-- cards injected by JS -->
            </div>
        </section>

        <!-- Bottom Console -->
        <section class="glass border-t border-white/5 px-4 py-3">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2 text-sm text-slate-300"><i data-lucide="terminal" class="w-4 h-4"></i><span>控制台输出</span></div>
                <div class="flex items-center gap-2">
                    <button id="btn-log-copy" class="px-2 py-1 text-xs rounded-lg border border-white/10 hover:bg-white/5">复制</button>
                    <button id="btn-log-clear" class="px-2 py-1 text-xs rounded-lg border border-white/10 hover:bg-white/5">清空</button>
                </div>
            </div>
            <div id="logbox" class="h-52 overflow-auto rounded-xl bg-slate-950/70 border border-white/5 p-3 font-mono text-sm leading-6">
                <pre id="log" class="whitespace-pre-wrap"></pre>
            </div>
        </section>
    </main>
</div>

<script>
    // --- Demo Data ---
    const devices = [
        { id: 'PC-001', name: 'PC-001', online: true },
        { id: 'PC-002', name: 'PC-002', online: false },
        { id: 'PC-003', name: 'PC-003', online: true },
        { id: 'PC-004', name: 'PC-004', online: true }
    ];

    const commands = [
        { id: 'restart', title: 'Restart Server', desc: '重启服务进程，清理僵尸进程', icon: 'rotate-ccw' },
        { id: 'deploy', title: 'Deploy App', desc: '构建并发布最新版本', icon: 'rocket' },
        { id: 'cache', title: 'Clear Cache', desc: '清理缓存与临时文件', icon: 'eraser' },
        { id: 'script', title: 'Run Script', desc: '执行预设脚本命令集', icon: 'terminal-square' },
        { id: 'backup', title: 'Backup', desc: '执行全量备份并校验', icon: 'database' },
        { id: 'update', title: 'System Update', desc: '安装系统更新并重启', icon: 'refresh-ccw' }
    ];

    // --- Render Helpers ---
    function updateStats(){
        const online = devices.filter(d=>d.online).length;
        document.getElementById('stat-online').textContent = online;
        document.getElementById('stat-offline').textContent = devices.length - online;
        document.getElementById('chip-online').textContent = online;
    }

    function renderDevices(){
        const box = document.getElementById('device-list');
        box.innerHTML = '';
        devices.forEach(d => {
            const row = document.createElement('button');
            row.className = 'card card-hover w-full text-left rounded-xl px-3 py-2.5 border flex items-center gap-3';
            row.innerHTML = `<span class="status-dot ${d.online? 'status-on':'status-off'}"></span>
                         <span class="font-medium">${d.name}</span>
                         <span class="ml-auto text-xs text-slate-400">${d.online? '在线':'离线'}</span>`;
            box.appendChild(row);
        });
    }

    function renderCards(){
        const grid = document.getElementById('card-grid');
        grid.innerHTML = '';
        commands.forEach(c => {
            const card = document.createElement('div');
            card.className = 'card card-hover rounded-2xl p-4 border shadow-soft flex flex-col';
            card.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-prime-400/30 to-indigo-400/30 grid place-items-center">
              <i data-lucide="${c.icon}" class="w-5 h-5"></i>
            </div>
            <div class="flex-1">
              <div class="font-semibold">${c.title}</div>
              <div class="text-sm text-slate-400">${c.desc}</div>
            </div>
            <button class="px-2 py-1 rounded-lg hover:bg-white/5 border border-white/10" title="更多"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
          </div>
          <div class="mt-4 flex items-center gap-2">
            <button data-cmd="${c.id}" class="run-btn inline-flex items-center gap-2 rounded-xl bg-slate-100 text-slate-900 font-semibold px-3 py-2 hover:opacity-90">
              <i data-lucide="play" class="w-4 h-4"></i> 运行
            </button>
            <button class="px-3 py-2 rounded-xl border border-white/10 hover:bg-white/5 inline-flex items-center gap-2"><i data-lucide="settings-2" class="w-4 h-4"></i> 参数</button>
          </div>`;
            grid.appendChild(card);
        });
        lucide.createIcons();

        document.querySelectorAll('.run-btn').forEach(btn => {
            btn.addEventListener('click', () => runDemo(btn.dataset.cmd));
        });
    }

    function logLine(text, cls='info'){
        const pre = document.getElementById('log');
        const line = document.createElement('div');
        line.className = 'log-line ' + cls;
        line.textContent = text;
        pre.appendChild(line);
        const box = document.getElementById('logbox');
        box.scrollTop = box.scrollHeight;
    }

    function runDemo(cmd){
        logLine(`$ 执行命令: ${cmd}  —  目标设备: 在线 ${devices.filter(d=>d.online).length} 台`, 'info');
        setTimeout(()=>logLine('[OK] 已下发任务…', 'ok'), 300);
        setTimeout(()=>logLine('[INFO] PC-001: 开始执行…', 'info'), 700);
        setTimeout(()=>logLine('[OK] PC-001: 完成', 'ok'), 1400);
        setTimeout(()=>logLine('[INFO] PC-003: 开始执行…', 'info'), 1700);
        setTimeout(()=>logLine('[ERR] PC-003: 超时，重试 1/2', 'err'), 2300);
        setTimeout(()=>logLine('[OK] PC-003: 完成', 'ok'), 3100);
    }

    function mountBasics(){
        renderDevices();
        updateStats();
        renderCards();
        lucide.createIcons();

        document.getElementById('btn-log-clear').onclick = () => {
            document.getElementById('log').innerHTML = '';
        };
        document.getElementById('btn-log-copy').onclick = async () => {
            const text = Array.from(document.querySelectorAll('#log .log-line')).map(n=>n.textContent).join('\n');
            try{ await navigator.clipboard.writeText(text); }catch(e){}
        };

        document.getElementById('btn-run-all').onclick = () => runDemo('playbook:all');
    }

    document.addEventListener('DOMContentLoaded', mountBasics);
</script>
</body>
</html>
