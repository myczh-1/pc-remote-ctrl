services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - tinyauth
      - cloud
      - frontend
    ports:
      - "8003:80"  # 宿主 8003 -> 容器 80
    volumes:
      - ./nginx.tinyauth.conf:/etc/nginx/nginx.conf:ro
    networks:
      - tinyauth_net

  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:v4
    environment:
      APP_URL: "${TINYAUTH_URL}"
      SECRET: "${TINYAUTH_SECRET}"
      COOKIE_DOMAIN: ".${ROOT_DOMAIN}"
      USERS: "root:$$2a$$10$$B8RbzgcAYEdXEPS7j.ek1e1FXJTWxE6B0wj849CRGJ2f8DsiEEwZy"
    expose:
      - "3000"
    networks:
      - tinyauth_net

  cloud:
    build:
      context: .                          # repo 根目录
      dockerfile: cloud-middleware/Dockerfile
    image: pc-remote/cloud-middleware:local
    environment:
      GRPC_PORT: "7073"
      AUTH_MODE: "none"
    ports:
      - "7073:7073"
    networks:
      - tinyauth_net

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      HOST: "0.0.0.0"
      PORT: "5173"
      VITE_API_URL: "http://cloud.localtest.me:8003"
      VITE_CLOUD_GRPCWEB_URL: "http://cloud.localtest.me:8003"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    expose:
      - "5173"
    networks:
      - tinyauth_net
    depends_on:
      - cloud

networks:
  tinyauth_net:
    driver: bridge

volumes:
  go-mod-cache:
  go-build-cache:
  frontend-node-modules:
