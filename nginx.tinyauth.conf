worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  proxy_buffering off;
  client_max_body_size 32m;

  # 连接升级 (websocket / grpc-web over http1.1)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 预检判断 & CORS helper
  map $http_origin $allow_origin {
    default $http_origin;
    ''      $scheme://$host;
  }

  map $request_method $is_preflight {
    default 0;
    OPTIONS 1;
  }

  # upstream 们：这一段对应 docker-compose 里的 service 名
  upstream tinyauth_upstream {
    server tinyauth:3000;
  }

  upstream cloud_upstream {
    server cloud:7073;
  }

  upstream frontend_upstream {
    server frontend:5173;
  }

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  ####################################################################
  # 1. TinyAuth 登录站点本身
  ####################################################################
  server {
    listen 80;
    server_name tinyauth.localtest.me;

    location / {
      proxy_pass http://tinyauth_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  ####################################################################
  # 2. 受保护的后端 API / gRPC-Web (cloud)
  ####################################################################
  server {
    listen 80;
    server_name cloud.localtest.me;

    # 子请求: 让 tinyauth 判断当前 cookie 是否已登录
    location = /__tinyauth_check {
      internal;
      proxy_pass http://tinyauth_upstream/api/auth/nginx;
      proxy_set_header Host tinyauth.localtest.me;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Uri $request_uri;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    # 未登录时，重定向到 tinyauth 登录界面
    location @tinyauth_login {
      return 302 http://tinyauth.localtest.me:8003/login?redirect_uri=$scheme://$host:8003$request_uri;
      #                  ^^^^^^^ 这里加上 :8003 非常重要
    }

    # 健康检查
    location = /healthz { return 200; }

    # 实际业务接口
    location / {
      # CORS 预检直接放行 + 返回允许头
      if ($is_preflight) {
        add_header Access-Control-Allow-Origin $allow_origin always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,X-Requested-With,X-Grpc-Web" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "grpc-status,grpc-message" always;
        add_header Vary "Origin" always;
        return 204;
      }

      # TinyAuth 鉴权
      auth_request /__tinyauth_check;
      error_page 401 = @tinyauth_login;

      # 真正转发到 cloud-middleware
      proxy_pass http://cloud_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header TE trailers;
      proxy_read_timeout 300s;

      # CORS headers 给实际请求
      add_header Access-Control-Allow-Origin $allow_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Expose-Headers "grpc-status,grpc-message" always;
      add_header Vary "Origin" always;
    }
  }

  ####################################################################
  # 3. 前端 (app) - 整个控制面板也要求已登录
  ####################################################################
  server {
    listen 80;
    server_name app.localtest.me;
    
    location ^~ /cloud/ {
    # 1. 处理预检
    if ($is_preflight) {
        add_header Access-Control-Allow-Origin $allow_origin always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,X-Requested-With,X-Grpc-Web" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "grpc-status,grpc-message" always;
        add_header Vary "Origin" always;
        return 204;
    }

    # 2. 让 TinyAuth 校验 cookie
    auth_request /__tinyauth_check;
    error_page 401 = @tinyauth_login;

    # 3. 把 /cloud/... 前缀去掉再丢给 cloud-middleware
    rewrite ^/cloud/(.*)$ /$1 break;

    # 4. 反代到 cloud
    proxy_pass http://cloud_upstream;
    proxy_http_version 1.1;

    # 关键：保持长连接 / 流式
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;

    # 不要乱改 Host，先用默认的透传（或者直接用 $host，而不是写死 cloud.localtest.me）
    proxy_set_header Host $host;

    # 保留这些转发头，方便后端知道真实来源/IP
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri $request_uri;

    # gRPC-Web / streaming 需要 TE: trailers，保持
    proxy_set_header TE trailers;

    # 非常关键：禁止缓冲响应，让 chunk 直接往浏览器刷
    proxy_buffering off;
    proxy_request_buffering off;

    # 读超时时间放大，WatchDevices 会挂很久
    proxy_read_timeout 3600s;

    # 5. CORS & grpc-web headers 回给浏览器
    add_header Access-Control-Allow-Origin $allow_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers "grpc-status,grpc-message" always;
    add_header Vary "Origin" always;
  }



    location = /__tinyauth_check {
      internal;
      proxy_pass http://tinyauth_upstream/api/auth/nginx;
      proxy_set_header Host tinyauth.localtest.me;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Uri $request_uri;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    location @tinyauth_login {
      return 302 http://tinyauth.localtest.me:8003/login?redirect_uri=$scheme://$host:8003$request_uri;
      #                  ^^^^^^^ 同样带上 :8003
    }

    location / {
      # OPTIONS 预检
      if ($is_preflight) {
        add_header Access-Control-Allow-Origin $allow_origin always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        return 204;
      }

      # 登录校验
      auth_request /__tinyauth_check;
      error_page 401 = @tinyauth_login;

      # 代理到 Vite dev server
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;

      add_header Access-Control-Allow-Origin $allow_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Vary "Origin" always;
    }
  }
}
