worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  proxy_buffering off;
  client_max_body_size 32m;

  map "" $root_domain       { default $env_ROOT_DOMAIN; }
  map "" $tinyauth_url      { default $env_TINYAUTH_URL; }
  map "" $cloud_upstream    { default $env_CLOUD_UPSTREAM; }
  map "" $frontend_upstream { default $env_FRONTEND_UPSTREAM; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  map $http_origin $allow_origin {
    default $http_origin;
    ''      $scheme://$host;
  }

  map $request_method $is_preflight {
    default 0;
    OPTIONS 1;
  }

  upstream tinyauth_upstream {
    server tinyauth:3000;
  }

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # TinyAuth public host
  server {
    listen 80;
    server_name tinyauth.$root_domain;

    location / {
      proxy_pass http://tinyauth_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # cloud middleware (protected)
  server {
    listen 80;
    server_name cloud.$root_domain;

    location = /__tinyauth_check {
      internal;
      proxy_pass http://tinyauth_upstream/api/auth/nginx;
      proxy_set_header Host tinyauth.$root_domain;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Uri $request_uri;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    location @tinyauth_login {
      return 302 $tinyauth_url/login?redirect_uri=$scheme://$host$request_uri;
    }

    location = /healthz { return 200; }

    location / {
      if ($is_preflight) {
        add_header Access-Control-Allow-Origin $allow_origin always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,X-Requested-With,X-Grpc-Web" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "grpc-status,grpc-message" always;
        add_header Vary "Origin" always;
        return 204;
      }

      auth_request /__tinyauth_check;
      error_page 401 = @tinyauth_login;

      proxy_pass $cloud_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header TE trailers;
      proxy_read_timeout 300s;

      add_header Access-Control-Allow-Origin $allow_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Expose-Headers "grpc-status,grpc-message" always;
      add_header Vary "Origin" always;
    }
  }

  # SPA / admin surface (protected by TinyAuth; drop auth_request for public access)
  server {
    listen 80;
    server_name app.$root_domain;

    location = /__tinyauth_check {
      internal;
      proxy_pass http://tinyauth_upstream/api/auth/nginx;
      proxy_set_header Host tinyauth.$root_domain;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Uri $request_uri;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    location @tinyauth_login {
      return 302 $tinyauth_url/login?redirect_uri=$scheme://$host$request_uri;
    }

    location / {
      if ($is_preflight) {
        add_header Access-Control-Allow-Origin $allow_origin always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        return 204;
      }

      auth_request /__tinyauth_check;
      error_page 401 = @tinyauth_login;

      proxy_pass $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;

      add_header Access-Control-Allow-Origin $allow_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Vary "Origin" always;
    }
  }
}
